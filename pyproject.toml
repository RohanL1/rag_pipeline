[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rohan", email = "rohan.v.lagare@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "pymupdf>=2.0",
    "pypdf>=6.21.2",
]

[project.scripts]
rag-pipeline = "rag_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
